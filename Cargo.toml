[package]
name = "plumage"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "A pointless swarm that must agree on a colour each day, and paints its own website with the result"
repository = "https://github.com/proof-computer/plumage"
publish = false

[[bin]]
name = "plumage"
path = "src/main.rs"

[dependencies]
forthebirds-inference = { git = "https://github.com/proof-computer/forthebirds", rev = "5f84ad1e795b1ab4b2aa4d0bb2d4843e74f4a264" }
forthebirds-names = { git = "https://github.com/proof-computer/forthebirds", rev = "5f84ad1e795b1ab4b2aa4d0bb2d4843e74f4a264" }
forthebirds-net = { git = "https://github.com/proof-computer/forthebirds", rev = "5f84ad1e795b1ab4b2aa4d0bb2d4843e74f4a264" }
forthebirds-runtime = { git = "https://github.com/proof-computer/forthebirds", rev = "5f84ad1e795b1ab4b2aa4d0bb2d4843e74f4a264" }
forthebirds-store = { git = "https://github.com/proof-computer/forthebirds", rev = "5f84ad1e795b1ab4b2aa4d0bb2d4843e74f4a264" }
forthebirds-sync = { git = "https://github.com/proof-computer/forthebirds", rev = "5f84ad1e795b1ab4b2aa4d0bb2d4843e74f4a264" }
liskov-cargo-harness = { git = "https://github.com/proof-computer/forthebirds", rev = "5f84ad1e795b1ab4b2aa4d0bb2d4843e74f4a264" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "process", "net"] }
url = { version = "2", features = ["serde"] }
axum = "0.8"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
jsonschema = { version = "0.60.1", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[patch.crates-io]
rouchdb-adapter-redb = { git = "https://github.com/proof-computer/forthebirds", rev = "5f84ad1e795b1ab4b2aa4d0bb2d4843e74f4a264" }
