[package]
name = "plumage"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "A pointless swarm that must agree on a colour each day, and paints its own website with the result"
repository = "https://github.com/proof-computer/plumage"
publish = false

[[bin]]
name = "plumage"
path = "src/main.rs"

[dependencies]
forthebirds-inference = { git = "https://github.com/proof-computer/forthebirds", rev = "0b3196a5c968bfe6500cfe92c7dcef54a1143e94" }
forthebirds-runtime = { git = "https://github.com/proof-computer/forthebirds", rev = "0b3196a5c968bfe6500cfe92c7dcef54a1143e94" }
forthebirds-store = { git = "https://github.com/proof-computer/forthebirds", rev = "0b3196a5c968bfe6500cfe92c7dcef54a1143e94" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = { version = "2", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
axum = "0.8"
jsonschema = { version = "0.60.1", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[patch.crates-io]
rouchdb-adapter-redb = { git = "https://github.com/proof-computer/forthebirds", rev = "0b3196a5c968bfe6500cfe92c7dcef54a1143e94" }
